name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  # Re-snapshot the GitHub account so new repos/pushes/issues reach the site.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Refresh GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # regenerate data/posts.json from content/blog frontmatter so a pushed
      # .md is enough to publish — no hand-edited post list anywhere
      - name: Build posts data
        run: node scripts/build-posts.mjs

      - name: Snapshot the home lab
        run: node scripts/fetch-lab.mjs

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # github-pages publishes within seconds of this job; the dispatch makes
      # the profile README sync run while the new blog.json is already live.
      # Needs PROFILE_SYNC_PAT (GitHub token) admitted to cyberd4ch/cyberd4ch.
      - name: Wake the profile README sync
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_SYNC_PAT }}
        run: |
          gh api -X POST repos/cyberd4ch/cyberd4ch/dispatches \
            -f event_type=blog-updated
          echo "blog-updated → cyberd4ch/cyberd4ch (sync-readme)"
