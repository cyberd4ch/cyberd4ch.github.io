<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3e81"/>
    </marker>
  </defs>
  <style>
    .ink { fill: #1a1a1e; }
    .dim { fill: #6b6a70; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #242326; stroke-width: 1.5; }
    .flow { stroke: #2f3e81; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
  </style>
  <rect x="0" y="0" width="1100" height="500" rx="16" fill="#fafafa" stroke="#d9d8dc"/>
  <text x="40" y="52" font-size="24" font-weight="700" class="ink">Gateway API splits what Ingress crammed into one object</text>
  <text x="40" y="78" font-size="15" class="dim">One class decides who plays. The door decides who gets in. The route decides where they go.</text>

  <!-- request path: browser -> gateway -> httproute -> service -> pod -->
  <g>
    <!-- browser -->
    <rect x="40" y="200" width="150" height="90" rx="10" class="box"/>
    <text x="115" y="235" font-size="16" font-weight="700" class="ink" text-anchor="middle">browser</text>
    <text x="115" y="262" font-size="13" class="dim" text-anchor="middle">https://app.lab.localhost</text>

    <!-- Gateway -->
    <rect x="250" y="140" width="300" height="210" rx="10" class="box" stroke="#2f3e81" stroke-width="2"/>
    <text x="270" y="168" font-size="13" class="dim">Gateway · the front door</text>
    <text x="270" y="194" font-size="18" font-weight="700" class="ink mono">lab-gateway</text>
    <line x1="270" y1="206" x2="530" y2="206" stroke="#e4e4e6"/>
    <text x="270" y="230" font-size="13.5" class="ink mono">listener https :443</text>
    <text x="270" y="252" font-size="13.5" class="ink mono">protocol HTTPS · terminate</text>
    <text x="270" y="274" font-size="13.5" class="ink mono">hostname app.lab.localhost</text>
    <text x="270" y="296" font-size="13.5" class="ink mono">cert ← secret app-lab-tls</text>
    <text x="270" y="330" font-size="12.5" class="dim" font-style="italic">annotation: cert-manager.io/cluster-issuer: lab-ca</text>

    <!-- HTTPRoute -->
    <rect x="610" y="170" width="250" height="120" rx="10" class="box"/>
    <text x="630" y="198" font-size="13" class="dim">HTTPRoute · the hallway</text>
    <text x="630" y="224" font-size="18" font-weight="700" class="ink mono">whoami</text>
    <text x="630" y="250" font-size="13" class="ink mono">hostname app.lab.localhost</text>
    <text x="630" y="272" font-size="13" class="ink mono">→ service whoami :80</text>

    <!-- service + pod -->
    <rect x="900" y="170" width="160" height="120" rx="10" class="box"/>
    <text x="980" y="198" font-size="13" class="dim" text-anchor="middle">Service</text>
    <text x="980" y="224" font-size="18" font-weight="700" class="ink mono" text-anchor="middle">whoami</text>
    <rect x="915" y="234" width="60" height="30" rx="6" fill="#b9e4aa" stroke="#4a7a3a"/>
    <text x="945" y="254" font-size="12" class="ink" text-anchor="middle">pod</text>
    <text x="980" y="282" font-size="11" class="dim" text-anchor="middle">traefik/whoami</text>

    <!-- GatewayClass label above -->
    <rect x="250" y="80" width="300" height="44" rx="10" fill="#efeef3" stroke="#2f3e81" stroke-dasharray="5 3"/>
    <text x="400" y="107" font-size="14" class="ink" text-anchor="middle">GatewayClass <tspan font-weight="700" class="mono">eg</tspan> → handled by Envoy Gateway</text>

    <!-- arrows -->
    <line x1="190" y1="245" x2="246" y2="245" class="flow"/>
    <text x="200" y="238" font-size="12.5" class="dim">TLS</text>
    <line x1="550" y1="245" x2="606" y2="245" class="flow"/>
    <line x1="860" y1="245" x2="896" y2="245" class="flow"/>
    <line x1="400" y1="124" x2="400" y2="136" class="flow"/>
  </g>

  <text x="40" y="420" font-size="14" class="dim">The padlock in the browser is terminated at the Gateway: it presents app-lab-tls to the client, then speaks plain HTTP to the backend inside the cluster.</text>
  <text x="40" y="445" font-size="14" class="dim">Envoy Gateway watches the Gateway object and stands up the proxy; cert-manager watches the same object's annotations.</text>
</svg>
